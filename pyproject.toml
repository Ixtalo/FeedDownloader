[project]
name = "feeddownloader"
description = "Download feeds (e.g. RSS) and all linked pages, like a crawler/scraper."
dynamic = [
    "license",
]
version = "1.7.0"
readme = "README.md"
authors = [
    {name = "Ixtalo", email = "ixtalo@users.noreply.github.com"},
]
requires-python = '>=3.12,<4.0'
dependencies = [
    'feedparser',
    'httpx',
    'fake-useragent',
    'beautifulsoup4',
    'lxml',
    'loguru',
    'typer',
    'validators',
]

[dependency-groups]
dev = [
    'pre-commit',
    'pytest',
    'pytest-cov',
    'mypy',
    "ruff (>=0.17.0,<0.18.0)",
]

[tool.poetry]
license = "AGPL-3.0-only"
package-mode = false
requires-poetry = '>=2.2.1'


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=downloader --cov-report=term-missing "


## https://docs.astral.sh/ruff/configuration/
[tool.ruff]
extend-exclude = ["testing"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D", "S", "BLE", "PTH", "RUF", "PT", "TRY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
